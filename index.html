<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChainGate — Web3 Wallet Gateway</title>
<style>
  :root{
    --bg:#06060c;
    --panel:rgba(255,255,255,.05);
    --panel-strong:rgba(255,255,255,.08);
    --stroke:rgba(255,255,255,.12);
    --txt:#eef0ff;
    --muted:#9aa0c3;
    --brand:#7c5cff;
    --brand2:#22d3ee;
    --ok:#34d399;
    --warn:#fbbf24;
    --bad:#f87171;
    --grad:linear-gradient(135deg,#7c5cff,#22d3ee);
    --shadow:0 24px 70px rgba(0,0,0,.45);
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--txt);
    background:
      radial-gradient(1200px 800px at 12% -10%, rgba(124,92,255,.18), transparent 55%),
      radial-gradient(1000px 700px at 100% 110%, rgba(34,211,238,.14), transparent 55%),
      var(--bg);
  }

  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.32;
    pointer-events:none;
    z-index:0;
  }

  .orb.a{
    width:420px;
    height:420px;
    background:#7c5cff;
    top:-120px;
    left:-100px;
    animation:float 14s ease-in-out infinite;
  }

  .orb.b{
    width:380px;
    height:380px;
    background:#22d3ee;
    bottom:-140px;
    right:-90px;
    animation:float 18s ease-in-out infinite reverse;
  }

  .orb.c{
    width:300px;
    height:300px;
    background:#f472b6;
    top:45%;
    left:55%;
    animation:float 22s ease-in-out infinite;
  }

  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(40px,-50px) scale(1.15)}
  }

  .grid-lines{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }

  .horizon{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:180px;
    background:linear-gradient(transparent, rgba(124,92,255,.08));
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }

  .horizon::before{
    content:'';
    position:absolute;
    inset:-60% -20% 0;
    background-image:
      linear-gradient(rgba(124,92,255,.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.18) 1px, transparent 1px);
    background-size:60px 60px;
    transform:perspective(340px) rotateX(62deg);
    animation:scrollG 3s linear infinite;
  }

  @keyframes scrollG{
    to{background-position:0 60px, 0 0;}
  }

  .page{
    display:none;
    position:relative;
    z-index:2;
    width:100%;
    min-height:100vh;
    flex-direction:column;
    align-items:center;
    padding:24px 20px 132px;
  }

  .page.active{
    display:flex;
    animation:fadeIn .4s ease both;
  }

  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }

  .grad{
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .fade-in{
    animation:fadeUp .55s ease both;
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }

  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:20px;
  }

  .logo-mark{
    width:36px;
    height:36px;
    border-radius:11px;
    background:var(--grad);
    display:grid;
    place-items:center;
    font-size:17px;
    box-shadow:0 8px 24px rgba(124,92,255,.5);
    position:relative;
    overflow:hidden;
    color:#fff;
  }

  .logo-mark::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
    animation:sweep 3s linear infinite;
  }

  @keyframes sweep{
    from{transform:translateX(-100%);}
    to{transform:translateX(100%);}
  }

  h1{
    font-size:clamp(34px,6vw,58px);
    line-height:1.08;
    font-weight:800;
    text-align:center;
    letter-spacing:-1.5px;
  }

  .sub{
    color:var(--muted);
    font-size:clamp(15px,2vw,18px);
    text-align:center;
    max-width:620px;
    margin-top:16px;
    line-height:1.65;
  }

  .topbar{
    position:sticky;
    top:14px;
    z-index:30;
    width:100%;
    max-width:1100px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    padding:12px 14px;
    margin-bottom:34px;
    background:rgba(6,6,12,.78);
    border:1px solid var(--stroke);
    border-radius:18px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }

  .topbar-badges{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }

  .top-cta{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:12px 24px;
    border:0;
    border-radius:999px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    color:#fff;
    background:var(--grad);
    box-shadow:0 12px 30px rgba(124,92,255,.4);
    transition:.25s;
    flex:0 0 auto;
    font-family:inherit;
  }

  .top-cta:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 38px rgba(124,92,255,.55);
  }

  .top-cta:active{
    transform:scale(.97);
  }

  .top-cta svg{
    width:16px;
    height:16px;
    flex:0 0 auto;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--stroke);
    background:var(--panel);
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }

  .badge svg{
    width:14px;
    height:14px;
    color:var(--brand2);
    flex:0 0 auto;
  }

  .badge .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 10px var(--ok);
    animation:pulse 2s infinite;
  }

  @keyframes pulse{
    50%{opacity:.4;}
  }

  .inner{
    width:100%;
    max-width:1100px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    text-align:center;
  }

  .headline{
    max-width:840px;
    perspective:700px;
  }

  .headline .w{
    display:inline-block;
    opacity:0;
    transform:translateY(26px) rotateX(35deg);
    animation:wordIn .6s cubic-bezier(.2,.9,.3,1.15) forwards;
  }

  @keyframes wordIn{
    to{
      opacity:1;
      transform:translateY(0) rotateX(0);
    }
  }

  .hero-stats{
    width:100%;
    max-width:680px;
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:14px;
  }

  .stat{
    background:var(--panel);
    border:1px solid var(--stroke);
    border-radius:18px;
    padding:18px 16px;
    text-align:center;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  .stat b{
    display:block;
    font-size:24px;
    background:var(--grad);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .stat span{
    display:block;
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
  }

  .cta-wrap{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-top:6px;
  }

  .cta-note{
    font-size:12.5px;
    color:var(--muted);
  }

  .btn{
    border:0;
    cursor:pointer;
    border-radius:16px;
    padding:16px 32px;
    font-size:15px;
    font-weight:700;
    color:#fff;
    background:var(--grad);
    box-shadow:0 14px 34px rgba(124,92,255,.35);
    transition:.25s;
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
  }

  .btn:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 44px rgba(124,92,255,.5);
  }

  .btn:active{
    transform:scale(.98);
  }

  .btn.ghost{
    background:var(--panel);
    border:1px solid var(--stroke);
    box-shadow:none;
    color:var(--txt);
  }

  .btn.ghost:hover{
    background:rgba(255,255,255,.09);
    border-color:rgba(255,255,255,.2);
    box-shadow:none;
  }

  .btn.block{
    width:100%;
  }

  .btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
  }

  .glow-btn{
    z-index:0;
  }

  .glow-btn::before{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:20px;
    background:var(--grad);
    filter:blur(18px);
    opacity:.45;
    z-index:-1;
    animation:glowPulse 2.6s ease-in-out infinite;
  }

  @keyframes glowPulse{
    0%,100%{opacity:.35; transform:scale(.97);}
    50%{opacity:.7; transform:scale(1.03);}
  }

  .trust{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:1px;
    text-transform:uppercase;
    align-items:center;
  }

  .trust span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  .trust svg{
    width:14px;
    height:14px;
    color:var(--brand2);
  }

  .prices-section{
    width:100%;
    max-width:1100px;
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .prices-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:13px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:2px;
    text-align:center;
  }

  .prices-title svg{
    width:16px;
    height:16px;
    color:var(--brand2);
  }

  .coin-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:12px;
  }

  .coin-card{
    background:var(--panel);
    border:1px solid var(--stroke);
    border-radius:16px;
    padding:16px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    animation:fadeUp .5s ease backwards;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .coin-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }

  .coin-name{
    font-size:13px;
    color:var(--muted);
    line-height:1.35;
  }

  .coin-sym{
    display:block;
    margin-top:3px;
    font-size:11px;
    color:var(--txt);
    font-weight:800;
    letter-spacing:.5px;
  }

  .coin-ico{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg, rgba(124,92,255,.16), rgba(34,211,238,.12));
    border:1px solid var(--stroke);
    color:var(--brand2);
    font-size:12px;
    font-weight:800;
  }

  .coin-price{
    font-size:18px;
    font-weight:800;
    color:var(--txt);
  }

  .coin-chg{
    font-size:12.5px;
    font-weight:700;
  }

  .coin-chg.up{
    color:var(--ok);
  }

  .coin-chg.down{
    color:var(--bad);
  }

  .ticker{
    position:fixed;
    left:0;
    right:0;
    bottom:18px;
    z-index:20;
    height:38px;
    display:flex;
    align-items:center;
    overflow:hidden;
    pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(6,6,12,.88) 12%, rgba(6,6,12,.88) 88%, transparent);
    border-top:1px solid rgba(255,255,255,.06);
    border-bottom:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  .ticker-in{
    display:inline-flex;
    white-space:nowrap;
    animation:tick 30s linear infinite;
    font-size:13px;
    color:var(--muted);
    font-weight:700;
    letter-spacing:.5px;
  }

  .ticker-in span{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-right:36px;
  }

  .ticker-in em{
    font-style:normal;
    font-size:12px;
    margin-left:6px;
  }

  .ticker-in em.up{
    color:var(--ok);
  }

  .ticker-in em.down{
    color:var(--bad);
  }

  @keyframes tick{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  .page-head{
    width:100%;
    max-width:1100px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }

  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--stroke);
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    transition:.2s;
  }

  .back:hover{
    color:#fff;
    background:rgba(255,255,255,.1);
    border-color:rgba(255,255,255,.2);
  }

  .back svg{
    width:16px;
    height:16px;
    color:var(--brand2);
  }

  .step{
    font-size:12px;
    color:var(--brand2);
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .page-content{
    width:100%;
    max-width:1100px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    text-align:center;
    margin-bottom:26px;
  }

  .page-title{
    font-size:clamp(26px,4vw,38px);
    letter-spacing:-.8px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--stroke);
    border-radius:24px;
    padding:34px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    width:100%;
    max-width:560px;
    box-shadow:var(--shadow);
  }

  .card-title{
    font-size:26px;
    line-height:1.2;
    margin-bottom:10px;
    text-align:left;
    letter-spacing:-.5px;
  }

  .card-title.center{
    text-align:center;
  }

  .card-sub{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.6;
    margin-bottom:22px;
    text-align:left;
  }

  .card-sub.center{
    text-align:center;
    margin-bottom:18px;
  }

  .field{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:18px;
  }

  label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    font-weight:700;
  }

  label svg{
    width:16px;
    height:16px;
    color:var(--brand2);
  }

  input[type=email],
  input[type=text],
  textarea{
    width:100%;
    padding:15px 16px;
    border-radius:14px;
    border:1px solid var(--stroke);
    background:rgba(0,0,0,.35);
    color:var(--txt);
    font-size:15px;
    outline:none;
    transition:.2s;
  }

  textarea{
    min-height:150px;
    resize:vertical;
    line-height:1.55;
    font-family:inherit;
  }

  input:focus,
  textarea:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 4px rgba(124,92,255,.18);
  }

  .paste-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }

  .paste-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid var(--stroke);
    background:rgba(0,0,0,.28);
    color:var(--muted);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    transition:.2s;
  }

  .paste-btn:hover{
    color:#fff;
    border-color:var(--brand);
    background:rgba(124,92,255,.12);
  }

  .paste-btn svg{
    width:15px;
    height:15px;
  }

  .word-count{
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:8px;
  }

  .word-count.ok{
    color:var(--ok);
  }

  .word-count.bad{
    color:var(--bad);
  }

  .error{
    display:none;
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    background:rgba(248,113,113,.1);
    border:1px solid rgba(248,113,113,.3);
    color:#fecaca;
    font-size:13px;
  }

  .error.show{
    display:block;
  }

  .gen-tab{
    margin-top:24px;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .wallet-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:14px;
    width:100%;
    max-width:1100px;
  }

  .wallet{
    position:relative;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--stroke);
    border-radius:18px;
    padding:20px 12px;
    text-align:center;
    cursor:pointer;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    opacity:0;
    transform:translateY(26px) scale(.94);
    animation:walletIn .55s cubic-bezier(.2,.9,.3,1.2) forwards;
    animation-delay:var(--d,0s);
    transition:transform .25s, border-color .25s, box-shadow .25s;
    font:inherit;
    color:inherit;
  }

  @keyframes walletIn{
    to{
      opacity:1;
      transform:translateY(0) scale(1);
    }
  }

  .wallet::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(140px circle at var(--mx,50%) var(--my,50%), rgba(124,92,255,.22), transparent 65%);
    opacity:0;
    transition:opacity .25s;
    pointer-events:none;
  }

  .wallet:hover::before{
    opacity:1;
  }

  .wallet::after{
    content:'';
    position:absolute;
    inset:-2px;
    border-radius:20px;
    padding:1.5px;
    background:var(--grad);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:opacity .25s;
    pointer-events:none;
  }

  .wallet:hover::after{
    opacity:1;
  }

  .wallet:hover{
    transform:translateY(-5px);
    border-color:rgba(124,92,255,.55);
    box-shadow:0 16px 36px rgba(124,92,255,.28);
  }

  .wallet:active{
    transform:scale(.96);
  }

  .wallet.selected{
    border-color:var(--brand);
    background:rgba(124,92,255,.14);
    box-shadow:0 16px 36px rgba(124,92,255,.28);
  }

  .wallet.selected::after{
    opacity:1;
  }

  .wallet .ico{
    width:54px;
    height:54px;
    border-radius:16px;
    margin:0 auto 12px;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:linear-gradient(135deg, rgba(124,92,255,.18), rgba(34,211,238,.14));
    border:1px solid rgba(124,92,255,.28);
    color:#d8ccff;
  }

  .wallet .ico svg{
    width:26px;
    height:26px;
  }

  .wallet .nm{
    font-size:14px;
    font-weight:700;
    color:var(--txt);
  }

  .wallet .ty{
    font-size:11.5px;
    color:var(--muted);
    margin-top:4px;
  }

  .ring{
    width:112px;
    height:112px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,.08);
    border-top-color:var(--brand);
    border-right-color:var(--brand2);
    animation:spin 1s linear infinite;
    margin:0 auto 24px;
  }

  @keyframes spin{
